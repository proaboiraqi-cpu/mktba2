<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AK Software</title>
<style>
:root { --brand:#1f5fbf; --bg:#f5f7fb; --card:#fff; --text:#1d2430; --muted:#6b7280; --warn:#b45309; --err:#b91c1c; --ok:#15803d; }
* { box-sizing: border-box; }
body { margin:0; font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif; background:var(--bg); color:var(--text); }
.app { max-width: 820px; margin: 0 auto; padding: 16px; }
h1 { margin: 8px 0 0; font-size: 26px; color: var(--brand); } h2 { font-size: 18px; margin: 22px 0 10px; }
.sub { margin: 4px 0 14px; color: var(--muted); } [hidden] { display:none !important; }
.drop { border:2px dashed #9bb8e6; background:#fff; border-radius:14px; padding:26px 16px; text-align:center; cursor:pointer; display:flex; flex-direction:column; gap:6px; }
.drop:hover { background:#f0f6ff; }
.engine { font-size:13px; color:var(--muted); margin:6px 2px; }
.settings { display:flex; flex-wrap:wrap; gap:14px; align-items:center; background:#fff; padding:10px 12px; border-radius:12px; margin:12px 0; }
.settings label { display:flex; gap:6px; align-items:center; }
.busy { margin:12px 0; } .bar { height:8px; background:#dfe6f3; border-radius:6px; overflow:hidden; margin-top:6px; } .bar div { height:100%; background:var(--brand); width:0; transition:width .2s; }
.error { background:#fee2e2; color:var(--err); padding:10px 12px; border-radius:10px; margin:10px 0; white-space:pre-wrap; }
.doc { display:flex; gap:12px; background:var(--card); padding:10px; border-radius:12px; margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
.doc > img { width:120px; height:92px; object-fit:contain; background:#eef1f6; border-radius:8px; cursor:zoom-in; flex-shrink:0; }
.fields { flex:1; display:flex; flex-direction:column; gap:6px; min-width:0; }
input[type=text], select, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid #cdd5e3; background:#fff; }
input[type=text], select { width:100%; }
.row { display:flex; flex-wrap:wrap; gap:6px; } .row button { padding:6px 10px; font-size:14px; cursor:pointer; }
button:disabled { opacity:.4; cursor:default; } button.danger { color:var(--err); border-color:#f2b8b8; }
.note { color:var(--muted); font-size:13px; } .warn { color:var(--warn); font-size:13px; } .ok { color:var(--ok); font-size:13px; }
.actions { display:flex; justify-content:center; margin:16px 0; gap:10px; }
button.primary { background:var(--brand); color:#fff; border:none; padding:14px 24px; font-size:17px; border-radius:10px; cursor:pointer; }
.pager { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:8px; }
.sheet { position:relative; width:100%; max-width:440px; margin:0 auto; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.18); overflow:hidden; }
.item { position:absolute; outline:1px dashed #c7d2e5; overflow:hidden; cursor:zoom-in; } .item.lowdpi { outline:2px solid var(--warn); }
.src { display:flex; gap:10px; align-items:center; background:#fff; padding:8px; border-radius:10px; margin-bottom:6px; font-size:14px; }
.src img { width:54px; height:54px; object-fit:cover; border-radius:6px; }
.zoom { position:fixed; inset:0; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center; padding:12px; z-index:10; } .zoom img { max-width:100%; max-height:100%; }
footer { text-align:center; color:var(--muted); margin:24px 0 8px; font-size:13px; }
</style>
</head>
<body>
<div class="app">
  <h1>AK Software</h1>
  <p class="sub">ارفع الصور، رتّب المستمسكات تلقائياً، ونزّل PDF جاهز للطباعة</p>

  <div id="drop" class="drop"><strong>اضغط لاختيار الصور (أو اسحبها هنا)</strong><span id="count">ما في صور بعد</span></div>
  <input id="file" type="file" accept="image/*" multiple hidden />
  <div class="engine" id="engine">أداة القص: ...</div>

  <div class="settings">
    <label>حجم الورقة <select id="paper"><option value="A4">A4</option><option value="A5">A5</option></select></label>
    <label><input type="checkbox" id="pagePerPerson" /> ورقة جديدة لكل شخص</label>
    <label><input type="checkbox" id="autoType" checked /> تعرّف تلقائي على النوع (أبطأ)</label>
  </div>

  <div id="busy" class="busy" hidden><span id="busyText"></span><div class="bar"><div id="busyBar"></div></div></div>
  <div id="err" class="error" hidden></div>

  <section id="docsSection" hidden><h2>المستمسكات</h2><div id="docs"></div></section>
  <section id="srcSection" hidden><h2>الصور الأصلية</h2><div id="sources"></div>
    <div class="note">إذا مستمسك ما انكشف تلقائياً، اضغط «أضف الصورة كاملة» تحت صورته.</div></section>

  <div class="actions"><button id="arrangeBtn" class="primary" hidden>رتّب المستمسكات تلقائياً</button></div>

  <section id="preview" hidden>
    <h2>معاينة الصفحات</h2>
    <div id="layoutErr" class="error" hidden></div>
    <div class="pager"><button id="prev">السابقة</button><span id="pageInfo"></span><button id="next">التالية</button></div>
    <div id="sheet" class="sheet"></div>
    <div class="actions"><button id="pdfBtn" class="primary">تنزيل PDF</button></div>
  </section>

  <div id="zoom" class="zoom" hidden><img id="zoomImg" alt="" /></div>
  <footer>الصور تُعالج داخل جهازك ولا تُرفع لأي مكان.</footer>
</div>
<script src="./lib/pdf-lib.min.js"></script>
<script src="./lib/tesseract.min.js"></script>
<script src="./engine.js"></script>
<script src="./classify.js"></script>
<script src="./imaging.js"></script>
<script src="./app.js"></script>
</body>
</html>
